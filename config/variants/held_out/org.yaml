# HELD-OUT GENERATOR VARIANT: a deliberately different synthetic organisation ("globex"), used only for scripts/run_variant.py.
# Nothing in the detectors, rules or thresholds was tuned against it. Differences from config/org.yaml that matter for detection:
#   - different home regions and time zones (rules take the home regions from this file)
#   - different headcount mix, later and more spread-out working hours, much higher weekend activity
#   - analysts do heavy S3 reading in long sessions (a false-positive trap for the "mass download" rule)
#   - different API mixes, a different CI role, human sessions that use Terraform user agents, more noise (on-call, travel, new hires)
org:
  name: globex
  account_id: "210987654321"
  home_regions: {eu-west-1: 0.6, eu-central-1: 0.4}
  signin_region: eu-west-1
  default_start: "2025-01-06"
  default_days: 7
  volume_scale: 1.0
  tz_offsets: [1, 1, 1, 2, 0, 1]

user_agents:
  cli: ["aws-cli/2.17.4 Python/3.11.9 Linux/6.1.0-21-amd64 exe/x86_64.debian.12 prompt/off",
        "aws-cli/2.15.17 Python/3.11.6 Darwin/23.4.0 source/arm64 prompt/off"]
  sdk: ["Boto3/1.35.0 md/Botocore#1.35.0 ua/2.0 os/linux#6.1.0 md/arch#x86_64 lang/python#3.12.4 md/pyimpl#CPython cfg/retry-mode#legacy Botocore/1.35.0",
        "aws-sdk-go-v2/1.30.3 os/linux lang/go#1.22.5 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.170.0"]
  console: ["Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
            "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"]
  terraform: ["aws-sdk-go/1.54.1 (go1.22.4; linux; amd64) APN/1.0 HashiCorp/1.0 Terraform/1.8.5 (+https://www.terraform.io)"]
  lambda: ["Boto3/1.34.131 md/Botocore#1.34.131 ua/2.0 os/linux#5.10.220 md/arch#x86_64 lang/python#3.11.9 md/pyimpl#CPython exec-env/AWS_Lambda_python3.11 cfg/retry-mode#legacy Botocore/1.34.131"]

personas:
  developers:
    count: 18
    weekday_prob: 0.9
    weekend_prob: 0.25
    sessions_per_day: [1, 4]
    hours: {mean: 11.0, sd: 2.5, min: 7.0, max: 22.0}
    events_per_session: {mu: 4.1, sigma: 0.9}
    mean_gap_s: 18
    console_prob: 0.55
    office_prob: 0.4
    home_ips: [1, 3]
    error_rate: 0.035
    ua_kinds: [cli, sdk, terraform]
    api_mix: {DescribeInstances: 6, DescribeVolumes: 3, ListBuckets: 3, GetObject: 10, PutObject: 6, ListObjects: 6, ListFunctions20150331: 7, GetFunction20150331v2: 6,
              UpdateFunctionCode20150331v2: 5, DescribeLogGroups: 7, DescribeLogStreams: 8, GetLogEvents: 16, FilterLogEvents: 10, GetCallerIdentity: 4, AssumeRole: 5,
              DescribeStacks: 5, UpdateStack: 1, GetParameter: 5, DescribeTable: 3, ListTables: 2, ListClusters: 5, DescribeDBInstances: 2, ListQueues: 2, CreateTags: 2,
              StartInstances: 1, StopInstances: 1, DescribeAlarms: 3, GetSecretValue: 0.4}
  admins:
    count: 3
    weekday_prob: 0.85
    weekend_prob: 0.1
    sessions_per_day: [1, 3]
    hours: {mean: 9.5, sd: 2.0, min: 6.5, max: 20.0}
    events_per_session: {mu: 4.0, sigma: 0.7}
    mean_gap_s: 25
    console_prob: 0.6
    office_prob: 0.5
    home_ips: [1, 2]
    error_rate: 0.02
    ua_kinds: [cli, sdk]
    api_mix: {ListUsers: 6, ListRoles: 8, ListPolicies: 4, GetUser: 6, ListAccessKeys: 8, ListAttachedUserPolicies: 5, GetAccountSummary: 3, CreateTags: 3, DescribeInstances: 4,
              DescribeSecurityGroups: 3, AuthorizeSecurityGroupIngress: 1.2, AttachRolePolicy: 0.8, CreateAccessKey: 0.5, DeleteAccessKey: 0.3, DescribeTrails: 3, GetTrailStatus: 3,
              ListDetectors: 3, LookupEvents: 5, GetCallerIdentity: 3, ListBuckets: 2, GetBucketPolicy: 2, ListGroups: 2, PutRolePolicy: 0.3, CreateUser: 0.15}
  analysts:
    count: 14
