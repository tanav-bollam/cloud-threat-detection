    hours: {mean: 10.0, sd: 2.2, min: 6.0, max: 21.0}
    events_per_session: {mu: 5.0, sigma: 0.9}          # long sessions: a few hundred events, many of them object reads
    mean_gap_s: 8
    console_prob: 0.35
    office_prob: 0.5
    home_ips: [1, 2]
    error_rate: 0.05
    ua_kinds: [sdk, cli]
