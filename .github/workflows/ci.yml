name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the test suite
        run: python -m pytest -q
        # Tests that need the large public datasets (flaws.cloud, Stratus samples) skip themselves when the data is absent.

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cloud-threat-detection:ci .
      - name: Start it and wait for the health endpoint
        run: |
          docker run -d --name ctd -p 8501:8501 cloud-threat-detection:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 3
          done
          docker logs ctd
          exit 1
